name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: django-importexport-flow tests py${{ matrix.python_version }} Django ${{ matrix.django_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12", "3.13"]
        django_version: ["5.0.*", "5.1.*", "5.2.*"]
        exclude:
          # Django 5.0 does not support Python 3.13.
          - python_version: "3.13"
            django_version: "5.0.*"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "Django==${{ matrix.django_version }}"

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: |
          if find tests -name 'test*.py' -print -quit | grep -q .; then
            python -m pytest
          else
            python manage.py check
          fi

  quality:
    name: quality py3.12 Django 5.2
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "Django==5.2.*"

      - name: Radon maintainability report
        continue-on-error: true
        run: |
          if ! report=$(python -m radon mi src/django_importexport_flow -s -e '*/migrations/*'); then
            echo "::warning::Radon could not generate the maintainability report."
            exit 1
          fi
          printf '### Radon maintainability index\n\n```\n%s\n```\n' "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check
          git diff --check

      - name: Tests with coverage
        run: python -m pytest --cov=django_importexport_flow --cov-branch --cov-report=term

      - name: Security and complexity
        run: |
          bandit -r src/django_importexport_flow -x src/django_importexport_flow/migrations -ll -ii
          pip-audit .
          vulture src/django_importexport_flow --min-confidence 90 --exclude '*/migrations/*'
          xenon src/django_importexport_flow --exclude '*/migrations/*' --max-absolute C --max-modules B --max-average A

      - name: Type check
        run: mypy src/django_importexport_flow

  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  install:
    name: Non-editable install
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from the local project, not editable
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          import django_importexport_flow
          from django_importexport_flow.apps import DjangoImportExportFlowConfig

          root = Path(django_importexport_flow.__file__).resolve().parent
          required = (
              root / "templates/django_importexport_flow/admin/report_import_import_data.html",
              root / "templates/django_importexport_flow/admin/report_import_import_confirm.html",
          )
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("installed package is missing: " + ", ".join(missing))
          installed = version("django-importexport-flow")
          if installed == "0.0.0":
              raise SystemExit("package metadata was not installed")
          print(installed, DjangoImportExportFlowConfig.name)
          PY

  build:
    name: Build django-importexport-flow
    needs: [tests, quality, install]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django==5.2.*"
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python .github/scripts/check-wheel-contents.py dist/*.whl

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: built-wheels
          path: dist/*.whl
          if-no-files-found: error


  install-wheels:
    name: Install built wheels in a clean environment
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "built-wheels*"
          path: ${{ runner.temp }}/built-wheels
          merge-multiple: true
      - name: Install and verify wheels outside the checkout
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/built-wheels/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected 1 built wheel(s), found ${#wheels[@]}."
            exit 1
          fi
          python - "${wheels[@]}" <<'PY'
          from email.parser import BytesParser
          import re
          import sys
          from zipfile import ZipFile

          names = []
          for wheel in sys.argv[1:]:
              with ZipFile(wheel) as archive:
                  metadata = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
                  if len(metadata) != 1:
                      raise SystemExit(f"Invalid wheel metadata: {wheel}")
                  name = BytesParser().parsebytes(archive.read(metadata[0]))["Name"]
                  if not name:
                      raise SystemExit(f"Missing wheel distribution name: {wheel}")
                  names.append(re.sub(r"[-_.]+", "-", name).lower())
          if sorted(names) != ['django-importexport-flow']:
              raise SystemExit(f"Unexpected wheel distributions: {names}")
          PY
          python -m venv "$RUNNER_TEMP/wheel-test"
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install "${wheels[@]}" "Django==5.2.*"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-test/bin/python" - <<'PY'
          import importlib
          from importlib.metadata import distribution
          from pathlib import Path

          import django
          from django.conf import settings
          settings.configure(
              SECRET_KEY="wheel-smoke-test",
              INSTALLED_APPS=["django.contrib.contenttypes", "django.contrib.auth"],
              DATABASES={"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}},
          )
          django.setup()

          for name, module_name in [('django-importexport-flow', 'django_importexport_flow')]:
              dist = distribution(name)
              module = importlib.import_module(module_name)
              location = Path(module.__file__).resolve()
              files = dist.files
              if files is None or location not in {Path(dist.locate_file(file)).resolve() for file in files}:
                  raise SystemExit(f"{module_name} was not imported from the installed {name} wheel: {location}")
              print(f"{name} {dist.version}: {location}")
          PY

  local-audit:
    name: Full audit (progressive)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        id: audit_setup
        continue-on-error: true
        run: python -m pip install -e ".[dev]" "Django==5.2.*"
      - name: Report setup failure
        if: steps.audit_setup.outcome == 'failure'
        run: |
          echo "::warning::Audit dependencies could not be installed; the full audit did not run."
          echo "Audit dependencies could not be installed; the full audit did not run." >> "$GITHUB_STEP_SUMMARY"
      - name: Run audit
        id: audit
        if: steps.audit_setup.outcome == 'success'
        continue-on-error: true
        run: make audit PYTHON=python
      - name: Report audit findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning::The full audit reported failures; see the audit step."
          echo "Full audit reported failures; see the audit step." >> "$GITHUB_STEP_SUMMARY"
